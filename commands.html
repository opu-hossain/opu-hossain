<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>archy — terminal &amp; tmux reference</title>
<style>
  :root{
    --bg:#1d2021;
    --bg-soft:#282828;
    --bg-card:#242423;
    --bg-side:#1b1c1d;
    --border:#3c3836;
    --border-soft:#32302f;
    --fg:#ebdbb2;
    --muted:#a89984;
    --dim:#665c54;
    --yellow:#d79921;
    --yellow-bright:#fabd2f;
    --green:#b8bb26;
    --aqua:#8ec07c;
    --blue:#458588;
    --blue-bright:#83a598;
    --red:#fb4934;
    --purple:#d3869b;
    --orange:#fe8019;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--mono);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  ::selection{background:var(--blue);color:var(--bg);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim);}

  /* ── top bar mimicking a kitty window ───────────── */
  .titlebar{
    display:flex;align-items:center;gap:8px;
    padding:11px 18px;background:var(--bg-soft);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:var(--red);} .dot.y{background:var(--yellow);} .dot.g{background:var(--green);}
  .titlebar .path{margin-left:12px;color:var(--muted);font-size:13px;}
  .titlebar .path b{color:var(--blue-bright);}
  .titlebar .host{margin-left:auto;color:var(--dim);font-size:12px;}

  .layout{max-width:1180px;margin:0 auto;display:flex;gap:0;align-items:flex-start;}

  /* ── sidebar ───────────────────────────────────────── */
  .sidebar{
    width:210px;flex-shrink:0;position:sticky;top:52px;
    max-height:calc(100vh - 52px);overflow-y:auto;
    padding:24px 10px 40px 20px;border-right:1px solid var(--border);
  }
  .sidebar .side-title{color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;}
  .sidebar .side-title:first-child{margin-top:0;}
  .sidebar a{
    display:block;color:var(--muted);text-decoration:none;font-size:12.5px;
    padding:4px 8px;border-radius:3px;margin-bottom:1px;border-left:2px solid transparent;
  }
  .sidebar a:hover{color:var(--fg);background:var(--bg-card);}
  .sidebar a.active{color:var(--yellow-bright);border-left-color:var(--yellow-bright);background:var(--bg-card);}

  .main{flex:1;min-width:0;padding:28px 28px 100px;}

  header h1{font-size:21px;margin:0 0 4px;color:var(--fg);font-weight:600;}
  header h1 .prompt{color:var(--green);}
  header p.sub{color:var(--muted);margin:0 0 22px;font-size:13.5px;}

  /* ── fzf-style search bar ─────────────────────────── */
  .fzf-box{border:2px solid var(--border);border-radius:3px;background:var(--bg-soft);overflow:hidden;margin-bottom:18px;}
  .fzf-input-row{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);}
  .fzf-input-row .arrow{color:var(--red);font-weight:bold;}
  .fzf-input-row input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:var(--mono);font-size:15px;}
  .fzf-input-row input::placeholder{color:var(--dim);}
  .fzf-meta{display:flex;justify-content:space-between;padding:6px 14px;font-size:11.5px;color:var(--yellow-bright);background:var(--bg-soft);}
  .fzf-meta span.count b{color:var(--aqua);}

  /* ── tabs ──────────────────────────────────────────── */
  .tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
  .tab{padding:7px 16px;border:1px solid var(--border);border-radius:3px;background:var(--bg-soft);color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:13px;user-select:none;transition:border-color .12s;}
  .tab:hover{color:var(--fg);border-color:var(--dim);}
  .tab.active{color:var(--bg);background:var(--yellow-bright);border-color:var(--yellow-bright);font-weight:600;}

  /* ── section headers ──────────────────────────────── */
  .app-header{
    display:flex;align-items:center;gap:10px;margin:34px 0 14px;
  }
  .app-header:first-of-type{margin-top:6px;}
  .app-header .app-icon{font-size:15px;}
  .app-header h2{font-size:15px;margin:0;color:var(--yellow-bright);text-transform:uppercase;letter-spacing:.05em;}
  .app-header .line{flex:1;height:1px;background:var(--border);}

  .section-label{
    color:var(--blue-bright);font-size:11.5px;font-weight:600;letter-spacing:.03em;
    margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border-soft);
    scroll-margin-top:60px;
  }

  /* ── command cards ─────────────────────────────────── */
  .grid{display:flex;flex-direction:column;gap:5px;}
  .card{
    display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start;
    padding:9px 14px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:3px;
    transition:border-color .12s, background .12s;
  }
  .card:hover{border-color:var(--dim);background:#282624;}
  .card .key{
    font-family:var(--mono);font-size:12.5px;color:var(--bg);
    background:var(--green);padding:3px 8px;border-radius:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;
    justify-self:start;margin-top:1px;
  }
  .card .key.blue{background:var(--blue-bright);color:var(--bg);}
  .card .key.purple{background:var(--purple);color:var(--bg);}
  .card .key.orange{background:var(--orange);color:var(--bg);}
  .card .key.aqua{background:var(--aqua);color:var(--bg);}
  .card .key.red{background:var(--red);color:var(--bg);}
  .card .key.yellow{background:var(--yellow-bright);color:var(--bg);}
  .card .desc{color:var(--fg);font-size:13.2px;line-height:1.45;}
  .card .desc .hl{color:var(--yellow-bright);}
  .card .desc code{background:var(--bg-side);padding:1px 5px;border-radius:2px;color:var(--aqua);font-size:12.3px;}

  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px;}
  .empty .arrow{color:var(--red);}

  footer{margin-top:50px;padding-top:16px;border-top:1px solid var(--border);color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  footer a{color:var(--blue-bright);text-decoration:none;}
  footer a:hover{text-decoration:underline;color:var(--aqua);}

  @media (max-width:900px){
    .sidebar{display:none;}
    .main{padding:20px 16px 80px;}
  }
  @media (max-width:640px){
    .card{grid-template-columns:1fr;gap:6px;}
  }
</style>
</head>
<body>

<div class="titlebar">
  <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
  <span class="path">archy <b>~/reference</b></span>
  <span class="host">tmux · shell</span>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main">
    <header>
      <h1><span class="prompt">❯</span> terminal &amp; tmux reference</h1>
      <p class="sub">The full command set for tmux and everyday shell work — not just what's bound in your dotfiles.</p>
    </header>

    <div class="fzf-box">
      <div class="fzf-input-row">
        <span class="arrow">&gt;</span>
        <input id="search" type="text" placeholder="fuzzy search commands, flags, or descriptions…" autocomplete="off" />
      </div>
      <div class="fzf-meta">
        <span class="count"><b id="resultCount">0</b>/<span id="totalCount">0</span></span>
        <span>gruvbox-hard</span>

    </div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="all">all</div>
      <div class="tab" data-tab="tmux">tmux</div>
      <div class="tab" data-tab="shell">shell</div>
    </div>

    <div id="results"></div>

    <footer>
      <span>a living reference — add to it as you learn more</span>
      <a href="https://github.com/opu-hossain" target="_blank" rel="noopener">github.com/opu-hossain</a>
    </footer>
  </div>
</div>

{app:'tmux', group:'Sessions', key:'prefix (  /  )', keyClass:'blue', desc:'Switch to the previous / next session.'},

{app:'tmux', group:'Windows', key:'prefix 0-9', keyClass:'green', desc:'Jump to window by number (you\'ve bound 1–5 explicitly).'},
{app:'tmux', group:'Windows', key:'prefix w', keyClass:'green', desc:'Open an interactive window list to choose from.'},
{app:'tmux', group:'Windows', key:'prefix .', keyClass:'green', desc:'Move the current window to a different index.'},
{app:'tmux', group:'Windows', key:'prefix f', keyClass:'green', desc:'Search across windows for one containing specific text.'},

{app:'tmux', group:'Panes', key:'prefix z', keyClass:'aqua', desc:'Zoom the active pane to fill the whole window; press again to restore.'},

{app:'tmux', group:'Copy mode & buffers', key:'ctrl+u  /  ctrl+d', keyClass:'purple', desc:'Inside copy mode: scroll up / down half a page.'},

{app:'tmux', group:'Copy mode & buffers', key:'tmux choose-buffer', keyClass:'purple', desc:'Interactively pick which stored buffer to paste.'},

{app:'tmux', group:'Misc commands', key:'tmux source-file ~/.tmux.conf', keyClass:'orange', desc:'Reload config from outside tmux (you\'ve bound <code>prefix r</code> to do this from inside).'},

{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix 1-5', keyClass:'yellow', desc:'Jump directly to window 1 through 5.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix Tab', keyClass:'yellow', desc:'Toggle back to the previously active window.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix q  /  Q', keyClass:'yellow', desc:'Kill the current pane / kill the current window (no confirmation).'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix d', keyClass:'yellow', desc:'Detach from the session.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix Enter', keyClass:'yellow', desc:'Enter copy mode.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'v  /  V  /  ctrl+v', keyClass:'yellow', desc:'Inside copy mode: char-wise / line-wise / rectangle selection.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'y  /  Enter', keyClass:'yellow', desc:'Inside copy mode: copy selection to the Wayland clipboard via wl-copy.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix p', keyClass:'yellow', desc:'Paste from the Wayland clipboard.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix S  /  R', keyClass:'yellow', desc:'tmux-resurrect: manually save / restore the session layout.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'auto-save', keyClass:'yellow', desc:'tmux-continuum saves your session every 15 minutes and restores it on tmux start.'},
{app:'tmux', group:'Your custom binds (.tmux.conf)', key:'prefix I', keyClass:'yellow', desc:'TPM: install any plugins listed in .tmux.conf that aren\'t installed yet.'},

// ═══════════════════════════════════════════════════════════════
// SHELL — your aliases & functions (.zshrc)
// ═══════════════════════════════════════════════════════════════
{app:'shell', group:'Your aliases & functions (.zshrc)', key:'ls', keyClass:'yellow', desc:'ls --color=auto — colorized listing.'},
{app:'shell', group:'Your aliases & functions (.zshrc)', key:'ll', keyClass:'yellow', desc:'ls -lah --color=auto — long listing, human-readable sizes, includes hidden files.'},

{app:'shell', group:'Your aliases & functions (.zshrc)', key:'copy  /  paste', keyClass:'yellow', desc:'wl-copy / wl-paste (falls back to xclip if wl-copy isn\'t found) — pipe into <code>copy</code>, or run <code>paste</code> to print clipboard contents.'},

{app:'shell', group:'Your aliases & functions (.zshrc)', key:'alt+c', keyClass:'yellow', desc:'fzf: fuzzy-find a directory and cd into it.'},

{app:'shell', group:'Your aliases & functions (.zshrc)', key:'Esc', keyClass:'yellow', desc:'Drop from insert into normal mode on the command line — shows a red [N] in your prompt.'},

{app:'shell', group:'Navigation & files', key:'pwd', keyClass:'green', desc:'Print the current working directory.'},

{app:'shell', group:'Navigation & files', key:'ln -s target link', keyClass:'green', desc:'Create a symbolic link pointing at <span class="hl">target</span>.'},

const APP_LABELS = { tmux: 'tmux', shell: 'shell / terminal' };
const APP_ICONS = { tmux: '▤', shell: '❯_' };

const $ = sel => document.querySelector(sel);
const searchInput = $('#search');
const resultsEl = $('#results');
const resultCountEl = $('#resultCount');
const totalCountEl = $('#totalCount');
const tabs = document.querySelectorAll('.tab');
const sidebarEl = $('#sidebar');

let activeTab = 'all';
totalCountEl.textContent = DATA.length;

function fuzzyMatch(query, text){
  query = query.toLowerCase();
  text = text.toLowerCase();
  if(!query) return true;
  let qi = 0;
  for(let i=0; i<text.length && qi<query.length; i++){
    if(text[i] === query[qi]) qi++;
  }
  return qi === query.length;
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function render(){
  const q = searchInput.value.trim();
  const filtered = DATA.filter(item=>{
    if(activeTab !== 'all' && item.app !== activeTab) return false;
    const haystack = `${item.key} ${item.desc} ${item.group}`.replace(/<[^>]*>/g,'');
    return fuzzyMatch(q, haystack);
  });

  resultCountEl.textContent = filtered.length;

  if(filtered.length === 0){
    resultsEl.innerHTML = `<div class="empty"><span class="arrow">✗</span> no matches — try a shorter query</div>`;
    sidebarEl.innerHTML = '';
    return;
  }

  // group by app then by group, preserving first-seen order
  const apps = [];
  filtered.forEach(item=>{
    let a = apps.find(a=>a.key===item.app);
    if(!a){ a = {key:item.app, groups:[]}; apps.push(a); }
    let g = a.groups.find(g=>g.label===item.group);
    if(!g){ g = {label:item.group, items:[]}; a.groups.push(g); }
    g.items.push(item);
  });
  // pin "your" custom sections to the top of each app
  apps.forEach(a=>{
    a.groups.sort((x,y)=> (y.label.includes('Your') ? 1 : 0) - (x.label.includes('Your') ? 1 : 0));
  });


  resultsEl.innerHTML = apps.map(a => `
    <div class="app-header"><span class="app-icon">${APP_ICONS[a.key]}</span><h2>${APP_LABELS[a.key]}</h2><div class="line"></div></div>
    ${a.groups.map(g => `
      <div class="section-label" id="sec-${slug(a.key+'-'+g.label)}">${g.label}</div>
      <div class="grid">
        ${g.items.map(item => `
          <div class="card">
            <span class="key ${item.keyClass}">${item.key}</span>
            <span class="desc">${item.desc}</span>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `).join('');

  buildSidebar(apps);
}

function buildSidebar(apps){
  sidebarEl.innerHTML = apps.map(a => `
    <div class="side-title">${APP_ICONS[a.key]} ${APP_LABELS[a.key]}</div>
    ${a.groups.map(g => `<a href="#sec-${slug(a.key+'-'+g.label)}">${g.label}</a>`).join('')}
  `).join('');
}

searchInput.addEventListener('input', render);
tabs.forEach(tab=>{
  tab.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    render();
  });
});

render();
searchInput.focus();
</script>
