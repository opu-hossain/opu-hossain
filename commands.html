<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>archy — zsh &amp; tmux reference</title>
<style>
  :root{
    --bg:#1d2021;
    --bg-soft:#282828;
    --bg-card:#242423;
    --border:#3c3836;
    --fg:#ebdbb2;
    --muted:#928374;
    --dim:#665c54;
    --yellow:#d79921;
    --yellow-bright:#fabd2f;
    --green:#b8bb26;
    --aqua:#8ec07c;
    --blue:#458588;
    --red:#fb4934;
    --purple:#d3869b;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--mono);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  /* ── top bar mimicking a kitty window ───────────── */
  .titlebar{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;background:var(--bg-soft);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:10;
  }
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:var(--red);} .dot.y{background:var(--yellow);} .dot.g{background:var(--green);}
  .titlebar .path{margin-left:12px;color:var(--muted);font-size:13px;}
  .titlebar .path b{color:var(--blue);}
  .titlebar .host{margin-left:auto;color:var(--dim);font-size:12px;}

  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px;}

  header h1{
    font-size:20px;margin:0 0 4px;color:var(--fg);font-weight:600;
  }
  header h1 .prompt{color:var(--green);}
  header p.sub{color:var(--muted);margin:0 0 24px;font-size:13.5px;}

  /* ── fzf-style search bar ─────────────────────────── */
  .fzf-box{
    border:2px solid var(--border);
    border-radius:2px;
    background:var(--bg-soft);
    overflow:hidden;
    margin-bottom:22px;
  }
  .fzf-input-row{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;border-bottom:1px solid var(--border);
  }
  .fzf-input-row .arrow{color:var(--red);font-weight:bold;}
  .fzf-input-row input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--fg);font-family:var(--mono);font-size:15px;
  }
  .fzf-input-row input::placeholder{color:var(--dim);}
  .fzf-meta{
    display:flex;justify-content:space-between;
    padding:5px 12px;font-size:11.5px;color:var(--yellow-bright);
    background:var(--bg-soft);
  }
  .fzf-meta span.count b{color:var(--aqua);}

  /* ── tabs ──────────────────────────────────────────── */
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    padding:6px 14px;border:1px solid var(--border);border-radius:2px;
    background:var(--bg-soft);color:var(--muted);cursor:pointer;
    font-family:var(--mono);font-size:13px;user-select:none;
  }
  .tab:hover{color:var(--fg);border-color:var(--dim);}
  .tab.active{color:var(--bg);background:var(--yellow-bright);border-color:var(--yellow-bright);font-weight:600;}

  /* ── section headers ──────────────────────────────── */
  .section-label{
    color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }

  /* ── command cards ─────────────────────────────────── */
  .grid{display:flex;flex-direction:column;gap:6px;}
  .card{
    display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;
    padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:3px;
  }
  .card .key{
    font-family:var(--mono);font-size:13px;color:var(--bg);
    background:var(--green);padding:3px 8px;border-radius:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;
    justify-self:start;
  }
  .card .key.alt{background:var(--purple);}
  .card .key.blue{background:var(--blue);color:var(--fg);}
  .card .desc{color:var(--fg);font-size:13.5px;line-height:1.4;}
  .card .desc .hl{color:var(--yellow-bright);}
  .card .tag{
    font-size:10.5px;color:var(--dim);border:1px solid var(--border);
    padding:2px 7px;border-radius:10px;white-space:nowrap;
  }
  .empty{color:var(--muted);text-align:center;padding:50px 0;font-size:14px;}
  .empty .arrow{color:var(--red);}

  footer{
    margin-top:50px;padding-top:16px;border-top:1px solid var(--border);
    color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  footer a{color:var(--blue);text-decoration:none;}
  footer a:hover{text-decoration:underline;color:var(--aqua);}

  @media (max-width:640px){
    .card{grid-template-columns:1fr;gap:6px;}
    .card .tag{justify-self:start;}
  }
</style>
</head>
<body>

<div class="titlebar">
  <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
  <span class="path">archy <b>~/reference</b></span>
  <span class="host">zsh · tmux</span>
</div>

<div class="wrap">
  <header>
    <h1><span class="prompt">❯</span> command reference</h1>
    <p class="sub">Every alias, keybind, and option from your .zshrc and .tmux.conf, in one searchable place.</p>
  </header>

  <div class="fzf-box">
    <div class="fzf-input-row">
      <span class="arrow">&gt;</span>
      <input id="search" type="text" placeholder="fuzzy search commands, keys, or descriptions…" autocomplete="off" />
    </div>
    <div class="fzf-meta">
      <span class="count"><b id="resultCount">0</b>/<span id="totalCount">0</span></span>
      <span>gruvbox-hard</span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="all">all</div>
    <div class="tab" data-tab="zsh">zsh</div>
    <div class="tab" data-tab="tmux">tmux</div>
  </div>

  <div id="results"></div>

  <footer>
    <span>source: .zshrc + .tmux.conf, annotated by hand</span>
    <a href="https://github.com/opu-hossain" target="_blank" rel="noopener">github.com/opu-hossain</a>
  </footer>
</div>

<script>
const DATA = [
  // ── ZSH: history ─────────────────────────────
  {app:'zsh', group:'History', key:'ctrl+r', keyClass:'blue', desc:'Fuzzy-search command history (via fzf key-bindings).'},
  {app:'zsh', group:'History', key:'!!', keyClass:'', desc:'Re-run the last command (standard zsh history expansion).'},
  {app:'zsh', group:'History', key:'HIST_IGNORE_ALL_DUPS', keyClass:'', desc:'Removes the older copy whenever a duplicate command is re-run, keeping history unique.'},
  {app:'zsh', group:'History', key:'SHARE_HISTORY', keyClass:'', desc:'All open shells write to and read from the same history file live.'},
  {app:'zsh', group:'History', key:'HIST_IGNORE_SPACE', keyClass:'', desc:'Prefix a command with a space to keep it out of history entirely.'},

  // ── ZSH: vim mode ────────────────────────────
  {app:'zsh', group:'Vim keybindings', key:'Esc', keyClass:'green', desc:'Drop from insert into <span class="hl">normal mode</span> on the command line. Red [N] appears in the prompt.'},
  {app:'zsh', group:'Vim keybindings', key:'v', keyClass:'green', desc:'In normal mode: open the current command line in Neovim to edit, then run it.'},
  {app:'zsh', group:'Vim keybindings', key:'ctrl+p / ctrl+n', keyClass:'green', desc:'Step backward / forward through history (emacs-style, works in insert mode).'},
  {app:'zsh', group:'Vim keybindings', key:'ctrl+a / ctrl+e', keyClass:'green', desc:'Jump to start / end of the line.'},
  {app:'zsh', group:'Vim keybindings', key:'ctrl+w', keyClass:'green', desc:'Delete the previous word.'},

  // ── ZSH: completion ──────────────────────────
  {app:'zsh', group:'Tab completion', key:'Tab', keyClass:'aqua', desc:'Open the arrow-key selectable completion menu.'},
  {app:'zsh', group:'Tab completion', key:'shift+Tab', keyClass:'aqua', desc:'Move backward through the completion menu.'},
  {app:'zsh', group:'Tab completion', key:'ctrl+t', keyClass:'aqua', desc:'fzf: fuzzy-find a file and insert its path at the cursor.'},
  {app:'zsh', group:'Tab completion', key:'alt+c', keyClass:'aqua', desc:'fzf: fuzzy-find a directory and cd into it.'},
  {app:'zsh', group:'Tab completion', key:'ctrl+r', keyClass:'aqua', desc:'fzf: fuzzy-search through shell history.'},

  // ── ZSH: clipboard ───────────────────────────
  {app:'zsh', group:'Clipboard', key:'copy', keyClass:'purple', desc:'Alias for <span class="hl">wl-copy</span> — pipe anything in to send it to the Wayland clipboard.'},
  {app:'zsh', group:'Clipboard', key:'paste', keyClass:'purple', desc:'Alias for <span class="hl">wl-paste</span> — print the current clipboard contents.'},

  // ── ZSH: aliases ─────────────────────────────
  {app:'zsh', group:'Aliases', key:'ll', keyClass:'', desc:'ls -lah — long listing, human-readable sizes, includes hidden files.'},
  {app:'zsh', group:'Aliases', key:'..  /  ...', keyClass:'', desc:'cd .. / cd ../.. — quick directory-up shortcuts.'},
  {app:'zsh', group:'Aliases', key:'vi / vim', keyClass:'', desc:'Both aliased to nvim.'},
  {app:'zsh', group:'Aliases', key:'cls', keyClass:'', desc:'Alias for clear.'},
  {app:'zsh', group:'Aliases', key:'y', keyClass:'', desc:'Launches yazi, then cd\'s your shell into whatever directory you exited it in.'},
  {app:'zsh', group:'Aliases', key:'man &lt;cmd&gt;', keyClass:'', desc:'Opens man pages inside Neovim (MANPAGER is set to "nvim +Man!").'},

  // ── TMUX: core ──────────────────────────────
  {app:'tmux', group:'Core', key:'ctrl+space', keyClass:'blue', desc:'Your prefix key — press before every binding below unless noted otherwise.'},
  {app:'tmux', group:'Core', key:'prefix r', keyClass:'blue', desc:'Reload ~/.tmux.conf without restarting the session.'},
  {app:'tmux', group:'Core', key:'mouse', keyClass:'blue', desc:'Mouse mode is on — click to select panes, drag to resize, scroll to view history.'},

  // ── TMUX: splits & windows ──────────────────
  {app:'tmux', group:'Splits & windows', key:'prefix v', keyClass:'green', desc:'Split the pane vertically (side by side), staying in the current directory.'},
  {app:'tmux', group:'Splits & windows', key:'prefix s', keyClass:'green', desc:'Split the pane horizontally (stacked), staying in the current directory.'},
  {app:'tmux', group:'Splits & windows', key:'prefix 1-5', keyClass:'green', desc:'Jump directly to window 1 through 5.'},
  {app:'tmux', group:'Splits & windows', key:'prefix Tab', keyClass:'green', desc:'Toggle back to the previously active window.'},

  // ── TMUX: pane nav/resize ────────────────────
  {app:'tmux', group:'Pane navigation', key:'prefix h j k l', keyClass:'aqua', desc:'Move focus between panes, vim-style directions.'},
  {app:'tmux', group:'Pane navigation', key:'prefix H J K L', keyClass:'aqua', desc:'Resize the active pane in that direction by 5 cells. Repeatable — hold prefix and tap the key again.'},

  // ── TMUX: kill/detach ────────────────────────
  {app:'tmux', group:'Kill & detach', key:'prefix q', keyClass:'red', desc:'Kill the current pane.'},
  {app:'tmux', group:'Kill & detach', key:'prefix Q', keyClass:'red', desc:'Kill the current window.'},
  {app:'tmux', group:'Kill & detach', key:'prefix d', keyClass:'red', desc:'Detach from the session, leaving it running in the background.'},

  // ── TMUX: copy mode ──────────────────────────
  {app:'tmux', group:'Copy mode (vi)', key:'prefix Enter', keyClass:'purple', desc:'Enter copy mode to scroll and select text.'},
  {app:'tmux', group:'Copy mode (vi)', key:'v', keyClass:'purple', desc:'Inside copy mode: begin a character-wise visual selection.'},
  {app:'tmux', group:'Copy mode (vi)', key:'V', keyClass:'purple', desc:'Inside copy mode: begin a line-wise visual selection.'},
  {app:'tmux', group:'Copy mode (vi)', key:'ctrl+v', keyClass:'purple', desc:'Inside copy mode: toggle rectangular (block) selection.'},
  {app:'tmux', group:'Copy mode (vi)', key:'y / Enter', keyClass:'purple', desc:'Copy the selection to the Wayland clipboard via wl-copy and exit copy mode.'},
  {app:'tmux', group:'Copy mode (vi)', key:'Esc', keyClass:'purple', desc:'Cancel copy mode without copying.'},
  {app:'tmux', group:'Copy mode (vi)', key:'prefix p', keyClass:'purple', desc:'Paste from the Wayland clipboard into the active pane.'},

  // ── TMUX: plugins ────────────────────────────
  {app:'tmux', group:'Plugins (TPM)', key:'prefix I', keyClass:'yellow', desc:'Install any plugins listed in .tmux.conf that aren\'t installed yet.'},
  {app:'tmux', group:'Plugins (TPM)', key:'prefix S', keyClass:'yellow', desc:'tmux-resurrect: manually save the current session layout.'},
  {app:'tmux', group:'Plugins (TPM)', key:'prefix R', keyClass:'yellow', desc:'tmux-resurrect: manually restore the last saved layout.'},
  {app:'tmux', group:'Plugins (TPM)', key:'auto-save', keyClass:'yellow', desc:'tmux-continuum saves your session every 15 minutes and restores it on tmux start.'},
];

const $ = sel => document.querySelector(sel);
const searchInput = $('#search');
const resultsEl = $('#results');
const resultCountEl = $('#resultCount');
const totalCountEl = $('#totalCount');
const tabs = document.querySelectorAll('.tab');

let activeTab = 'all';
totalCountEl.textContent = DATA.length;

function fuzzyMatch(query, text){
  query = query.toLowerCase();
  text = text.toLowerCase();
  if(!query) return true;
  let qi = 0;
  for(let i=0; i<text.length && qi<query.length; i++){
    if(text[i] === query[qi]) qi++;
  }
  return qi === query.length;
}

function render(){
  const q = searchInput.value.trim();
  const filtered = DATA.filter(item=>{
    if(activeTab !== 'all' && item.app !== activeTab) return false;
    const haystack = `${item.key} ${item.desc} ${item.group}`.replace(/<[^>]*>/g,'');
    return fuzzyMatch(q, haystack);
  });

  resultCountEl.textContent = filtered.length;

  if(filtered.length === 0){
    resultsEl.innerHTML = `<div class="empty"><span class="arrow">✗</span> no matches — try a shorter query</div>`;
    return;
  }

  // group by 'group' label in original order
  const groups = [];
  const seen = new Set();
  filtered.forEach(item=>{
    const groupKey = item.app + '::' + item.group;
    if(!seen.has(groupKey)){
      seen.add(groupKey);
      groups.push({key: groupKey, app: item.app, label: item.group, items: []});
    }
    groups.find(g=>g.key===groupKey).items.push(item);
  });

  resultsEl.innerHTML = groups.map(g => `
    <div class="section-label">${g.app} · ${g.label}</div>
    <div class="grid">
      ${g.items.map(item => `
        <div class="card">
          <span class="key ${item.keyClass}">${item.key}</span>
          <span class="desc">${item.desc}</span>
          <span class="tag">${item.app}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
}

searchInput.addEventListener('input', render);
tabs.forEach(tab=>{
  tab.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    render();
  });
});

render();
searchInput.focus();
</script>

</body>
</html>
